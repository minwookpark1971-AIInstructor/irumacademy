<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 | Irum Academy</title>
    <meta name="description" content="Irum Academy 로그인">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/animations.css">
    <link rel="stylesheet" href="../../css/modernist.css?v=2">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    
    <!-- jQuery Validation -->
    <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>
</head>
<body>
    <!-- Header -->
    <div id="header-container"></div>

    <!-- Main Content -->
    <main class="main-content" style="padding-top: 120px; padding-bottom: 3rem;">
        <section class="section">
            <div class="container" style="max-width: 500px;">
                <div class="card reveal-up">
                    <div class="card-header text-center">
                        <h1 class="card-title" style="font-size: 2rem; margin-bottom: 0.5rem;">로그인</h1>
                        <p class="card-description">계정에 로그인하세요</p>
                    </div>
                    <div class="card-content">
                        <form id="login-form" class="auth-form">
                            <!-- Error Message -->
                            <div class="error-message alert alert-error" style="display: none; margin-bottom: 1rem; padding: 0.75rem; background-color: #fee2e2; color: #dc2626; border-radius: var(--radius-lg);"></div>
                            
                            <!-- Email -->
                            <div class="form-group">
                                <label for="email" class="form-label">이메일</label>
                                <div style="position: relative;">
                                    <input 
                                        type="email" 
                                        id="email" 
                                        name="email" 
                                        class="form-input" 
                                        placeholder="example@email.com"
                                        required
                                        style="padding-left: 2.5rem;"
                                    >
                                    <span style="position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%);">✉</span>
                                </div>
                            </div>
                            
                            <!-- Password -->
                            <div class="form-group">
                                <label for="password" class="form-label">비밀번호</label>
                                <div style="position: relative;">
                                    <input 
                                        type="password" 
                                        id="password" 
                                        name="password" 
                                        class="form-input" 
                                        placeholder="비밀번호를 입력하세요"
                                        required
                                        style="padding-left: 2.5rem; padding-right: 2.5rem;"
                                    >
                                    <span style="position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%);">🔒</span>
                                    <button 
                                        type="button" 
                                        class="toggle-password" 
                                        style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer;"
                                    >
                                        👁
                                    </button>
                                </div>
                            </div>
                            
                            <!-- Submit Button -->
                            <button type="submit" class="btn btn-primary btn-lg btn-block btn-animated" style="margin-top: 1.5rem;">
                                로그인
                            </button>
                        </form>
                        
                        <!-- Signup Link -->
                        <div style="text-align: center; margin-top: 2rem; font-size: 0.875rem;">
                            계정이 없으신가요? 
                            <a href="signup.html" style="color: var(--primary); font-weight: 500; text-decoration: none;">회원가입</a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="../../js/components.js?v=2"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/auth.js"></script>
    
    <script>
        $(document).ready(function() {
            // 소셜 로그인 영역 완전 제거
            function removeSocialLogin() {
                // 소셜 로그인 관련 요소 제거
                $('.social-login, .social-login-container, .social-login-buttons, .oauth-buttons, .sns-login').remove();
                $('.divider, .divider-text, .or-divider').remove();
                $('.btn-google, .btn-naver, .btn-kakao, .btn-apple').remove();
                $('[class*="social"], [class*="oauth"], [id*="social"], [id*="oauth"]').remove();
                $('button[onclick*="social"], button[onclick*="oauth"]').remove();
                
                // "또는" 텍스트가 포함된 요소 제거
                $('*').each(function() {
                    const text = $(this).text().trim();
                    if (text === '또는' || text === '또는 ' || text.includes('또는')) {
                        // 부모 요소가 form 내부에 있고 다른 중요한 내용이 없으면 제거
                        if ($(this).closest('form').length && $(this).siblings().length === 0) {
                            $(this).remove();
                        }
                    }
                });
                
                // 소셜 로그인 관련 텍스트가 포함된 모든 요소 찾아서 제거
                $('div, p, span, button, a').each(function() {
                    const text = $(this).text().toLowerCase();
                    if (text.includes('google') || text.includes('naver') || text.includes('kakao') || text.includes('apple') || 
                        text.includes('소셜') || text.includes('social')) {
                        // 버튼이나 링크인 경우에만 제거
                        if ($(this).is('button') || $(this).is('a') || $(this).hasClass('btn')) {
                            $(this).remove();
                        }
                    }
                });
            }
            
            // 즉시 실행
            removeSocialLogin();
            
            // 짧은 간격으로 여러 번 실행
            setTimeout(removeSocialLogin, 50);
            setTimeout(removeSocialLogin, 100);
            setTimeout(removeSocialLogin, 200);
            setTimeout(removeSocialLogin, 500);
            
            // Wait for components to load
            setTimeout(function() {
                // 다시 한번 제거 (동적으로 추가된 경우 대비)
                removeSocialLogin();
                
                // Initialize auth forms
                if (typeof initLoginForm === 'function') {
                    initLoginForm();
                }
                if (typeof initPasswordToggle === 'function') {
                    initPasswordToggle();
                }
                
                // Initialize animations
                if (typeof initRevealAnimations === 'function') {
                    initRevealAnimations();
                }
            }, 200);
            
            // MutationObserver로 동적 추가 감지 및 제거
            if (typeof MutationObserver !== 'undefined') {
                const observer = new MutationObserver(function(mutations) {
                    let shouldRemove = false;
                    mutations.forEach(function(mutation) {
                        if (mutation.addedNodes.length > 0) {
                            mutation.addedNodes.forEach(function(node) {
                                if (node.nodeType === 1) { // Element node
                                    const $node = $(node);
                                    const text = $node.text().toLowerCase();
                                    const classes = $node.attr('class') || '';
                                    const id = $node.attr('id') || '';
                                    
                                    if (text.includes('google') || text.includes('naver') || text.includes('kakao') || 
                                        text.includes('apple') || text.includes('소셜') || text.includes('social') ||
                                        text.includes('또는') || classes.includes('social') || classes.includes('oauth') ||
                                        id.includes('social') || id.includes('oauth')) {
                                        shouldRemove = true;
                                    }
                                }
                            });
                        }
                    });
                    if (shouldRemove) {
                        removeSocialLogin();
                    }
                });
                
                observer.observe(document.body, {
                    childList: true,
                    subtree: true,
                    characterData: true
                });
            }
        });
    </script>
    
    <style>
        .alert {
            padding: 0.75rem;
            border-radius: var(--radius-lg);
            margin-bottom: 1rem;
        }
        .alert-error {
            background-color: #fee2e2;
            color: #dc2626;
        }
        .alert-success {
            background-color: #d1fae5;
            color: #059669;
        }
        
        /* 소셜 로그인 영역 완전 제거 */
        .social-login,
        .social-login-container,
        .social-login-buttons,
        .oauth-buttons,
        .sns-login,
        .divider,
        .divider-text,
        .or-divider,
        [class*="social"],
        [class*="oauth"],
        [id*="social"],
        [id*="oauth"],
        button[onclick*="social"],
        button[onclick*="oauth"],
        .btn-google,
        .btn-naver,
        .btn-kakao,
        .btn-apple {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            height: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
        }
    </style>
</body>
</html>
